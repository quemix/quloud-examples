name: Deploy Sphinx site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make html
      # The English edition goes under /en/ (_ext/english_edition.py).
      - run: make html-en
      # Report published English pages whose translation is out of date.
      # This only warns: a pending translation must not hold back the Japanese site.
      - name: Check the English edition
        run: |
          python3 - <<'PY'
          import json, os
          status = json.load(open('_build/html/en/published.json', encoding='utf-8'))
          lines = [f"English edition: {len(status['published'])} published pages"]
          for doc, counts in status['outdated'].items():
              detail = ', '.join(f'{key} {value}' for key, value in counts.items())
              print(f'::warning title=English edition out of date::{doc}: {detail}')
              lines.append(f'- out of date: `{doc}` ({detail})')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
